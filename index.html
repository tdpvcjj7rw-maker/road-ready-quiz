<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>STRANDED: A Road Ready Adventure</title>
<style>
  :root {
    --bg: #0b0d14;
    --card: #151926;
    --accent: #ffb703;
    --good: #3ddc97;
    --bad: #ff5d5d;
    --text: #eef0f5;
    --muted: #9aa2b1;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: radial-gradient(circle at 50% -10%, #1a1f30, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100%;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 18px 60px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    text-align: center;
    margin-bottom: 22px;
  }
  header .kicker {
    letter-spacing: 3px;
    font-size: 12px;
    color: var(--accent);
    text-transform: uppercase;
    font-weight: 700;
  }
  header h1 {
    font-size: 26px;
    margin: 6px 0 0;
    line-height: 1.2;
  }
  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 22px 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.06);
    flex: 1;
    display: flex;
    flex-direction: column;
    animation: fadeIn 0.35s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .scene-label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .scene-text {
    font-size: 17px;
    line-height: 1.55;
    margin-bottom: 22px;
    white-space: pre-line;
  }
  .choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: auto;
  }
  button.choice {
    background: #1e2436;
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15.5px;
    text-align: left;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease;
    line-height: 1.4;
    -webkit-tap-highlight-color: transparent;
  }
  button.choice:active {
    transform: scale(0.98);
    background: #262e46;
  }
  .ending-card {
    text-align: center;
  }
  .ending-emoji {
    font-size: 48px;
    margin-bottom: 6px;
  }
  .ending-title {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 14px;
  }
  .ending-good .ending-title { color: var(--good); }
  .ending-bad .ending-title { color: var(--bad); }
  .ending-neutral .ending-title { color: var(--accent); }
  .score-box {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .score-number {
    font-size: 40px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
  }
  .score-number span {
    font-size: 18px;
    font-weight: 600;
    color: var(--muted);
  }
  .score-tier {
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--text);
    margin: 8px 0 8px;
  }
  .score-blurb {
    font-size: 14px;
    line-height: 1.5;
    color: var(--muted);
  }
  .restart {
    margin-top: 24px;
    background: var(--accent);
    color: #1a1300;
    border: none;
    border-radius: 12px;
    padding: 14px 20px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
  }
  .restart:active { transform: scale(0.98); }
  .secondary {
    margin-top: 10px;
    background: transparent;
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  .secondary:active { transform: scale(0.98); }
  .start-screen {
    text-align: center;
  }
  .start-screen p {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 26px;
  }
  .go-btn {
    background: var(--accent);
    color: #1a1300;
    border: none;
    border-radius: 14px;
    padding: 16px 20px;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    width: 100%;
  }
  .go-btn:active { transform: scale(0.98); }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 20px;
  }
</style>
</head>

</div>

  },
  end_c2_notaminute: {
    tone: "bad", emoji: "⏱️", title: "NOT EVEN A MINUTE",
    text: "You're back in ninety seconds. On a hot day, a closed car doesn't need much longer than that to turn dangerous — for a pet or for a person. This isn't the ending with a funny lesson attached. Never leave anyone in a parked car. Not for a minute. Not with the windows cracked. Not \"just this once.\"",
    restart: "c2_title"
  }
};

const ratingTiers = [
  { max: 14, title: "PUBLIC HAZARD",
    text: "You are a hazard to yourself and everyone around you. Go ahead and pick out a padded room now — you're going to be there a while." },
  { max: 29, title: "BARELY VERTICAL",
    text: "Somehow you're still standing. Nobody knows how. The car definitely doesn't." },
  { max: 44, title: "CHAOS GREMLIN",
    text: "You didn't cause every problem tonight, but you didn't prevent a single one either." },
  { max: 59, title: "COIN FLIP ENERGY",
    text: "Fifty-fifty. Technically passing. Technically." },
  { max: 74, title: "GETTING THERE",
    text: "You'd survive a real emergency — with a story that starts with \"okay, in my defense...\" at least twice." },
  { max: 87, title: "SOLID CITIZEN",
    text: "Calm, capable, mostly correct. Your parents can finally stop white-knuckling the passenger door handle." },
  { max: 96, title: "CERTIFIED ROAD READY",
    text: "You know exactly what you're doing. AAA should be cutting you a commission check." },
  { max: 100, title: "THE MALE MARY POPPINS",
    text: "Practically perfect in every way. Somewhere, a Scoutmaster is taking notes and feeling personally attacked." }
];

function getRating(pct) {
  return ratingTiers.find(t => pct <= t.max);
}

let scoreEarned = 0;
let scorePossible = 0;

const card = document.getElementById('card');

function startFresh(id) {
  scoreEarned = 0;
  scorePossible = 0;
  renderTitle(id);
}

function renderTitle(id) {
  id = id || 'title';
  const s = scenes[id];
  card.innerHTML = `
    <div class="start-screen">
      <div class="ending-emoji">🚙</div>
      <div class="ending-title" style="color: var(--accent)">${s.title}</div>
      <p>${s.text}</p>
      <button class="go-btn" id="startBtn">${s.startLabel || 'Start the Night'}</button>
    </div>
  `;
  document.getElementById('startBtn').onclick = () => renderScene(s.next);
}

function renderScene(id) {
  if (id.startsWith('end_')) return renderEnding(id);
  const s = scenes[id];
  const html = `
    <div class="scene-text">${s.text}</div>
    <div class="choices">
      ${s.choices.map((c, i) => `<button class="choice" data-next="${c.next}" data-points="${c.points === undefined ? '' : c.points}">${c.label}</button>`).join('')}
    </div>
  `;
  card.innerHTML = html;
  card.querySelectorAll('.choice').forEach(btn => {
    btn.onclick = () => {
      const pts = btn.getAttribute('data-points');
      if (pts !== '') {
        scorePossible += 10;
        scoreEarned += Number(pts);
      }
      renderScene(btn.getAttribute('data-next'));
    };
  });
}

function renderEnding(id) {
  const e = endings[id];
  const pct = scorePossible > 0 ? Math.round((scoreEarned / scorePossible) * 100) : 100;
  const rating = getRating(pct);
  const advanceBtn = e.advance
    ? `<button class="go-btn" id="advanceBtn">Continue to Chapter 2 →</button>`
    : '';
  const restartLabel = e.advance ? "Replay This Chapter" : "Play Again";
  const restartClass = e.advance ? "secondary" : "restart";
  card.innerHTML = `
    <div class="ending-card ending-${e.tone}">
      <div class="ending-emoji">${e.emoji}</div>
      <div class="ending-title">${e.title}</div>
      <div class="scene-text">${e.text}</div>
      <div class="score-box">
        <div class="score-number">${pct}<span>/100</span></div>
        <div class="score-tier">${rating.title}</div>
        <div class="score-blurb">${rating.text}</div>
      </div>
      ${advanceBtn}
      <button class="${restartClass}" id="restartBtn">${restartLabel}</button>
    </div>
  `;
  if (e.advance) {
    document.getElementById('advanceBtn').onclick = () => renderTitle(e.advance);
  }
  document.getElementById('restartBtn').onclick = () => startFresh(e.restart);
}

startFresh('title');
</script>
</body>
</html>
